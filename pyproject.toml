[project]
name = "bibcheck"
version = "0.1.0"
description = "Verify, correct and enrich BibTeX references from online sources (no generative AI)"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]
[project.optional-dependencies]
web = ["flask>=3.0"]
[project.scripts]
bibcheck = "bibcheck.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["bibcheck"]
